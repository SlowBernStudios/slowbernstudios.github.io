<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We moved - Slowbern Studios</title>
  <link rel="canonical" href="https://slowbern.dev/">
  <link rel="stylesheet" href="style.css">
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }

    .card {
      max-width: 720px;
      width: min(100%, 720px);
      margin: 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 40px);
      color: var(--ember-text);
    }

    p {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--warm-text);
    }

    .note {
      margin-top: 16px;
      font-size: 14px;
      color: var(--light-ash);
    }
  </style>
  <script src="main.js" defer></script>
</head>
<body>
  <main class="card" role="main">
    <h1>We moved!</h1>
    <p>Hey! We’re hanging out at slowbern.dev now. We’ll send you there in a few seconds.</p>
    <a class="btn" href="https://slowbern.dev/" data-redirect>
      Take me there <span aria-live="polite">(<span data-countdown>10</span>s)</span>
    </a>
    <div class="note">Auto-redirect in 10 seconds, or click the button to go now.</div>
  </main>
</body>
</html>
